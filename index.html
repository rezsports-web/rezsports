<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Futbol Fit</title>
  <meta name="description" content="Futbol Fit training programs — anytime, anywhere." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0c3d2e" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Futbol Fit" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header class="topbar">
      <button id="backBtn" class="icon-btn back-btn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark">FF</span>
        <span class="brand-name">Futbol Fit</span>
      </div>
      <div class="topbar-spacer"></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="programs" aria-label="Programs">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Programs</span>
      </button>
      <button class="tab-btn" data-tab="today" aria-label="Today">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="5" width="16" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 9.5h16M8 3v3M16 3v3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Today</span>
      </button>
      <button class="tab-btn" data-tab="install" aria-label="Get the App">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 18v1.5A1.5 1.5 0 006.5 21h11a1.5 1.5 0 001.5-1.5V18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Get App</span>
      </button>
    </nav>
  </div>

  <div id="installToast" class="install-toast" hidden>
    <span>Install Futbol Fit on your phone for quick, offline access.</span>
    <button id="installToastBtn">Install</button>
    <button id="installToastClose" aria-label="Dismiss">&times;</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
